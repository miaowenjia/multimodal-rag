services:
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: rag-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - chroma

  rag-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - rag-api

